apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sagarmohite76/cloudnative-gitops.git
    targetRevision: main
    path: frontend

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
