apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sagarmohite76/cloudnative-gitops.git
    targetRevision: main
    path: frontend

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
