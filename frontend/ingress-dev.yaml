apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-dev
  namespace: frontend-dev
spec:
  ingressClassName: traefik
  rules:
    - host: sagarai-dev.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-dev-service
                port:
                  number: 80
