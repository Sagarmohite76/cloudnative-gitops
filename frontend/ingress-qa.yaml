apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-qa
  namespace: frontend-qa
spec:
  ingressClassName: traefik
  rules:
    - host: sagarai-qa.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-qa-service
                port:
                  number: 80
