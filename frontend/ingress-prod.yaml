apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-prod
  namespace: frontend-prod
spec:
  ingressClassName: traefik
  rules:
    - host: cloudnative-sagar.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-prod-service
                port:
                  number: 80
